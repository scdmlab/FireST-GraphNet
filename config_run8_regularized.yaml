data:
  root: "C:\\Users\\22125\\Desktop\\FireST-GraphNet"
  T_in: 9
  T_out: 1
  img_size: 256
  num_bands: 8
  label_channel: 1
  val_split: 0.1
  num_workers: 0
  pin_memory: true

model:
  in_channels: 8
  encoder_channels: [32, 64, 128]
  use_cbam: true
  patch_size: 8
  k_neighbors: 8
  gnn_hidden: 128
  gnn_layers: 2
  lstm_hidden: 256
  lstm_layers: 2
  lstm_dropout: 0.2
  decoder_channels: [128, 64, 32]
  out_channels: 1

training:
  batch_size: 4
  epochs: 40
  lr: 0.0003
  weight_decay: 0.001
  scheduler: cosine
  step_size: 15
  gamma: 0.5
  pos_weight: 6.0
  grad_clip: 0.8
  mixed_precision: true
  save_every: 5
  patience: 8
  val_every: 1
  metric_every: 5

forecast:
  enabled: true
  T_in: 10
  horizon: 20
  future_channels: 4
  future_emb_dim: 64
  inference_mode: "firepred"
  in_channels: 28

firepred:
  static_bands: [0, 1, 2]
  slow_bands: [3, 13, 16]
  dynamic_non_forecastable: [4, 11, 12, 14, 15]
  dynamic_forecastable: [5, 6, 7, 8, 9, 10, 17, 18]
  future_dynamic_bands:
    temperature: 5
    wind_speed: 9
    wind_direction: 10
    humidity: 7

sources:
  firepred:
    description: "TS-SatFire FirePred 19-band (training source)"
    future_channels: 4
    channel_order: [temperature, u_wind, v_wind, humidity]
    notes: "u,v derived from wind speed + direction bands"

pinn:
  gamma: 0.25
  pde_D: 0.01
  pde_mu: 0.12
  beta_max: 0.02
  eta_max: 0.12
  xi_max: 0.08
  warmup_epochs: 8
  start_epoch: 3

seed: 42
device: "cuda"
output_dir: "outputs/run8_regularized"
