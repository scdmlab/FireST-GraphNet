data:
  root: C:\Users\22125\Desktop\FireST-GraphNet
  T_in: 9
  T_out: 1
  img_size: 256
  num_bands: 8
  label_channel: 1
  val_split: 0.1
  num_workers: 0        # Windows compatibility
  pin_memory: true

model:
  in_channels: 8
  encoder_channels:
  - 32
  - 64
  - 128
  use_cbam: true
  patch_size: 8
  k_neighbors: 8
  gnn_hidden: 128
  gnn_layers: 2
  lstm_hidden: 256
  lstm_layers: 2
  lstm_dropout: 0.2
  decoder_channels:
  - 128
  - 64
  - 32
  out_channels: 1

training:
  batch_size: 8
  epochs: 60            # run9 still learning at ep26; give more room
  lr: 0.0003
  weight_decay: 0.001
  scheduler: cosine
  pos_weight: 4.5       # run9 recall>>precision; bring down from 6.0
  dice_weight: 0.5      # NEW — soft Dice corrects spatial misalignment
  grad_clip: 0.5        # tighter than 0.8 to prevent ep17-style collapse
  mixed_precision: true
  save_every: 5
  patience: 15          # run9 stopped at ep26; was still learning
  val_every: 1
  metric_every: 5

forecast:
  enabled: true
  T_in: 10
  horizon: 20
  future_channels: 4
  future_emb_dim: 64
  weather_channels: 4
  weather_emb_dim: 64
  inference_mode: firepred
  in_channels: 28

pinn:
  gamma: 0.25
  pde_D: 0.01
  pde_mu: 0.12
  beta_max: 0.02
  eta_max: 0.20         # raised from 0.12; activates mono loss
  xi_max: 0.15          # raised from 0.08
  warmup_epochs: 8
  start_epoch: 3

seed: 42
device: cuda
output_dir: outputs/run11
